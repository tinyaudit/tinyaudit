# Pre-commit hooks for TinyAudit.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
#
# Mirrors what CI rechecks: black, ruff, isort, mypy on the strict modules.
# Config for each tool lives in pyproject.toml (line length 100, isort profile
# "black", mypy strict on fairness/uncertainty/card).
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        name: mypy (strict modules)
        files: ^src/tinyaudit/(fairness|uncertainty|card)/
        args: [--ignore-missing-imports]
        additional_dependencies: [pydantic>=2, numpy<2]
