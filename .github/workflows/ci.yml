name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint deps
        run: pip install black ruff mypy pydantic>=2 numpy"<2" pandas

      - name: black
        run: black --check --diff src/ tests/

      - name: ruff
        run: ruff check src/ tests/

      - name: mypy (strict modules)
        run: |
          pip install -e ".[dev]" --no-deps -q
          mypy src/tinyaudit/fairness/ src/tinyaudit/uncertainty/ src/tinyaudit/card/ \
               --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install numpy pin first
        run: pip install "numpy<2"

      # lime 0.2.0.1 needs the legacy distutils install path
      - name: Install lime (fragile build)
        env:
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: pip install "lime==0.2.0.1" "scikit-image<0.23"

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: pytest with coverage
        run: |
          pytest --cov=src/tinyaudit --cov-report=term-missing \
                 --cov-fail-under=70 \
                 -q
